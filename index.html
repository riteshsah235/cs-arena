<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070910">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%2305060f%27/%3E%3Cpath d=%27M50 8 90 30v40L50 92 10 70V30z%27 fill=%27none%27 stroke=%27%2319e6ff%27 stroke-width=%278%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2712%27 fill=%27%23ff2bd6%27/%3E%3C/svg%3E">
<title>CS Arena &amp; Academy</title>
<meta name="description" content="CS Arena & Academy: learn core computer science subjects, play practice mini-games and battle friends live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070910; --bg2:#0b0e19; --panel:#0f1320; --panel2:#131828; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --cyan:#7c8cff; --pink:#f472b6; --lime:#34d399; --amber:#fbbf24; --red:#f87171; --ink:#eef0fa; --dim:#9aa3bd; --mute:#6b7494;
  --brand:#7c8cff; --brand2:#a78bfa;
  --ui:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --disp:'Inter','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r2:12px; --accent:var(--brand);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:
  radial-gradient(1100px 520px at 50% -140px,rgba(124,140,255,.20),transparent 70%),
  radial-gradient(700px 400px at 90% 10%,rgba(167,139,250,.10),transparent 70%),var(--bg);background-attachment:fixed}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 0,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 55% at 50% 0,#000 20%,transparent 75%)}
#app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 24px 40px;min-height:100dvh;display:flex;flex-direction:column}
.screen{animation:in .35s ease both;display:flex;flex-direction:column;gap:18px;flex:1;max-width:860px;width:100%;margin:0 auto;padding-top:max(22px,env(safe-area-inset-top))}
.wrap{display:flex;flex-direction:column;gap:88px;flex:1}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
a{color:inherit}
h1,h2,h3,.disp{font-family:var(--ui);margin:0;letter-spacing:-.02em;font-weight:700;text-transform:none}
.dim{color:var(--dim)}.small{font-size:14px}.center{justify-content:center;text-align:center}.grow{flex:1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* surfaces */
.cut{clip-path:none}
.panel{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -18px rgba(0,0,0,.7)}
.panel.edge::before{display:none}
.frame{filter:none}

/* buttons */
.btn{appearance:none;border:1px solid transparent;cursor:pointer;font:600 15px var(--ui);letter-spacing:0;text-transform:none;color:#fff;
  padding:12px 20px;min-height:46px;border-radius:12px;background:linear-gradient(180deg,#8d9bff,#6674f0);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 8px 22px -8px rgba(102,116,240,.7);
  transition:transform .12s,box-shadow .15s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;gap:8px}
.btn:hover{filter:brightness(1.08);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 28px -8px rgba(102,116,240,.9)}
.btn:active{transform:scale(.98)}
.btn.pink{background:linear-gradient(180deg,#f78fc4,#e0539a);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 8px 22px -8px rgba(224,83,154,.7)}
.btn.amber{background:linear-gradient(180deg,#fcd34d,#f5a623);color:#2a1a00;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 22px -8px rgba(245,166,35,.6)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border-color:var(--line2);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.08);filter:none;box-shadow:none}
.btn.lg{padding:15px 26px;min-height:54px;font-size:16px;border-radius:14px}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.back{font:500 14px var(--ui);color:var(--dim);background:none;border:0;cursor:pointer;padding:10px 0}
.back:hover{color:var(--ink)}

/* inputs */
input[type=text]{width:100%;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line2);padding:13px 15px;font:500 16px var(--ui);outline:none;border-radius:12px;transition:border-color .15s,box-shadow .15s}
input[type=text]::placeholder{color:var(--mute)}
input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(124,140,255,.18)}
input.code{text-transform:uppercase;text-align:center;letter-spacing:.4em;font:700 22px var(--mono)}
label.lbl,.lbl{display:block;font:600 13px var(--ui);letter-spacing:0;color:var(--dim);margin-bottom:8px;text-transform:none}

/* profile */
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rank-badge{width:48px;height:48px;display:grid;place-items:center;font:800 18px var(--ui);color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:14px;box-shadow:0 8px 20px -8px rgba(124,140,255,.8)}
.xp{flex:1;min-width:160px}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rankname{font:600 14px var(--ui);color:var(--amber)}

/* mode / zone / level cards */
.modes,.lvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mode,.zone,.lvcard{cursor:pointer;text-align:left;border:0;color:inherit;font:inherit;padding:0;background:none;transition:transform .18s}
.mode:hover,.zone:hover,.lvcard:hover{transform:translateY(-3px)}
.zone:hover .panel,.mode:hover .panel,.lvcard:hover .panel{border-color:var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
.zone .panel{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:128px;height:100%}
.zone h3{font-size:15px;line-height:1.35;font-weight:600}
.zone .meta,.lvcard .cnt{font:500 12px var(--ui);color:var(--dim);letter-spacing:0}
.zone .znum{font:600 11px var(--ui);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.zone .ico svg{width:24px;height:24px}
.zone.all .panel{background:linear-gradient(135deg,rgba(124,140,255,.2),rgba(167,139,250,.08));border-color:rgba(124,140,255,.4)}
.zone .bar{margin-top:auto}
.lvcard .panel{border-top:2px solid var(--lc);min-height:150px;display:flex;flex-direction:column;gap:8px}
.lvcard h3{color:var(--lc);font-size:20px}.lvcard p{margin:0;color:var(--dim);font-size:15px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.hud.solo{grid-template-columns:1fr auto}
.pcard{padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.pcard.me{border-left:3px solid var(--brand)}
.pcard.opp{border-right:3px solid var(--pink);text-align:right;align-items:flex-end}
.pcard .nm{font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pcard .sc{font:800 28px var(--ui);color:#fff;letter-spacing:-.02em}
.pcard .st{font:500 12px var(--ui);color:var(--dim);min-height:15px}
.pcard .st.on{color:var(--lime)}
.pcard .pop{position:absolute;top:-6px;right:10px;font:800 18px var(--ui);color:var(--lime);animation:pop 1.4s ease forwards;pointer-events:none}
.pcard.me .pop{left:10px;right:auto}
@keyframes pop{from{opacity:0;transform:translateY(14px)}20%{opacity:1}to{opacity:0;transform:translateY(-26px)}}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px;min-width:92px}
.mid .rd{font:600 11px var(--ui);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.mid .tm{font:800 32px var(--ui);color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.mid .tm.low{color:var(--red);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.timebar{height:6px;background:rgba(255,255,255,.07);border-radius:99px;position:relative;overflow:hidden}
.timebar>i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,var(--lime),var(--amber) 60%,var(--red));border-radius:99px}

/* question */
.qcard{padding:26px 26px 28px}
.qtopic{font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtext{font-size:clamp(19px,3.2vw,26px);line-height:1.35;font-weight:600;letter-spacing:-.01em;white-space:pre-wrap}
pre.code{margin:14px 0 0;padding:14px 16px;background:#05070d;border:1px solid var(--line);border-radius:12px;font:500 clamp(13px,2.4vw,15px)/1.6 var(--mono);color:#c5ccff;overflow-x:auto;white-space:pre}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.opts{grid-template-columns:1fr}#app{padding-bottom:76px}.mute{right:auto;left:12px;bottom:12px;width:38px;height:38px}}
.opt{appearance:none;border:0;cursor:pointer;text-align:left;color:var(--ink);font:500 16px/1.4 var(--ui);padding:0;background:none;position:relative;transition:transform .12s}
.opt .in{display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:62px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;transition:background .15s,border-color .15s}
.opt .k{flex:none;width:30px;height:30px;display:grid;place-items:center;font:700 13px var(--ui);color:var(--dim);border:1px solid var(--line2);border-radius:9px;background:rgba(255,255,255,.04)}
.opt .tx{flex:1;word-break:break-word}
.opt .tx.mono{font:500 14px/1.4 var(--mono)}
.opt:hover:not([disabled]) .in{background:rgba(124,140,255,.1);border-color:rgba(124,140,255,.5)}
.opt:hover:not([disabled]) .k{color:var(--brand);border-color:var(--brand)}
.opt.picked .in{border-color:var(--amber);background:rgba(251,191,36,.08)}
.opt.right .in{border-color:var(--lime);background:rgba(52,211,153,.12)}
.opt.right .k{color:#04130c;background:var(--lime);border-color:var(--lime)}
.opt.wrong .in{border-color:var(--red);background:rgba(248,113,113,.1)}
.opt.wrong .k{color:#1a0505;background:var(--red);border-color:var(--red)}
.opt.gone{opacity:.2;pointer-events:none}
.opt[disabled]{cursor:default}
.opt .tagr{position:absolute;right:16px;top:-8px;font:700 10px var(--ui);letter-spacing:.08em;padding:3px 8px;background:var(--pink);color:#1a0210;z-index:2;border-radius:99px}
.opt .tagy{background:var(--brand);color:#fff;right:auto;left:16px}
.explain{padding:16px 20px;border-left:3px solid var(--lime);background:rgba(52,211,153,.07);border-radius:var(--r2);animation:in .3s ease both}
.explain.bad{border-left-color:var(--red);background:rgba(248,113,113,.07)}
.explain .hd{font:700 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.explain .hd.g{color:var(--lime)}.explain .hd.r{color:var(--red)}
.explain p{margin:0;line-height:1.55;font-size:16px;white-space:pre-wrap;color:#dfe3f5}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{font:600 13px var(--ui);letter-spacing:0;padding:9px 14px;border:1px solid var(--line2);background:rgba(255,255,255,.035);color:var(--dim);cursor:pointer;border-radius:99px;transition:all .15s}
.chip:hover:not([disabled]){color:var(--ink);background:rgba(255,255,255,.07)}
.chip.on{color:var(--amber);border-color:var(--amber)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.lvl{display:inline-block;font:700 10px var(--ui);letter-spacing:.08em;padding:3px 9px;color:#08090f;background:var(--c);margin-left:8px;vertical-align:middle;border-radius:99px}
.qtopic .lvl{margin-left:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip.lv{border-color:color-mix(in srgb,var(--c) 50%,transparent);color:var(--c)}
.chip.lv.on{background:var(--c);color:#08090f;border-color:var(--c);font-weight:700}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;overflow:hidden}
.rv summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.rv summary::-webkit-details-marker{display:none}
.rv .mk{flex:none;width:26px;height:26px;display:grid;place-items:center;font:800 13px var(--ui);color:#07090f;border-radius:8px}
.rv.ok{border-left:3px solid var(--lime)}.rv.ok .mk{background:var(--lime)}
.rv.bad{border-left:3px solid var(--red)}.rv.bad .mk{background:var(--red)}
.rv .qt{flex:1;font-size:15px;line-height:1.4;white-space:pre-wrap;font-weight:500}
.rv .body{padding:0 16px 16px 54px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.rv .ans{padding:9px 12px;border-left:3px solid var(--line2);background:rgba(255,255,255,.03);border-radius:8px}
.rv .ans.c{border-left-color:var(--lime)}.rv .ans.w{border-left-color:var(--red)}
.rv .ans b{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
.rv .ex{color:#dfe3f5;line-height:1.5}
.rvhd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}

/* lobby */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.slot{padding:22px 16px;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.slot .av{font:800 24px var(--ui);width:58px;height:58px;margin:0 auto;display:grid;place-items:center;border-radius:18px;color:#fff}
.slot.p1 .av{background:linear-gradient(135deg,var(--brand),var(--brand2))}.slot.p2 .av{background:linear-gradient(135deg,var(--pink),#c084fc)}
.slot.empty .av{background:rgba(255,255,255,.06);color:var(--dim);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
.slot .n{font:600 15px var(--ui);word-break:break-word}
.vsmark{font:800 clamp(22px,6vw,38px) var(--ui);color:var(--amber)}
.roomcode{font:800 clamp(38px,11vw,70px) var(--mono);letter-spacing:.18em;color:#fff;text-align:center;padding-left:.18em;background:linear-gradient(180deg,#fff,#aab4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.linkbox{display:flex;gap:10px;flex-wrap:wrap}
.linkbox input{flex:1;min-width:200px;font:500 14px var(--mono)}

/* results */
.banner{text-align:center;padding:14px 0}
.banner h2{font-size:clamp(34px,9vw,68px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.banner.win h2{background:linear-gradient(180deg,#fff,#c7ccff 60%,var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.banner.lose h2{color:var(--red)}.banner.draw h2{color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:16px;text-align:center}
.stat .v{font:800 28px var(--ui);color:#fff;letter-spacing:-.02em}
.stat .l{font:600 11px var(--ui);letter-spacing:.06em;color:var(--dim);margin-top:4px;text-transform:uppercase}
.stand{display:flex;align-items:center;gap:14px;padding:14px 18px}
.stand.first{border-color:rgba(251,191,36,.5);background:linear-gradient(180deg,rgba(251,191,36,.1),rgba(251,191,36,.03))}
.stand .pos{font:800 22px var(--ui);color:var(--amber);width:34px}
.stand .nm{flex:1;font:600 15px var(--ui)}
.stand .pt{font:800 22px var(--ui)}
.weak{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:600 13px var(--ui);padding:7px 12px;border:1px solid rgba(244,114,182,.5);color:var(--pink);border-radius:99px;background:rgba(244,114,182,.06)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:#151a2b;border:1px solid var(--line2);color:var(--ink);padding:12px 18px;font:600 14px var(--ui);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);max-width:92vw}
.toast.err{border-color:var(--red)}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,6,12,.88);display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}
.countdown{font:800 clamp(120px,36vw,260px) var(--ui);letter-spacing:-.05em;background:linear-gradient(180deg,#fff,var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent;animation:cd 1s ease-out infinite}
@keyframes cd{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(.92);opacity:.85}}
.fight{font:800 clamp(60px,16vw,130px) var(--ui);color:var(--amber);letter-spacing:-.03em}
.mute{position:fixed;right:14px;bottom:14px;opacity:.85;z-index:60;background:rgba(15,19,32,.9);border:1px solid var(--line2);color:var(--dim);width:42px;height:42px;font-size:17px;cursor:pointer;border-radius:12px;backdrop-filter:blur(8px)}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:auto;padding-top:20px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* ===== nav ===== */
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 0;margin:0 0 4px;background:linear-gradient(180deg,rgba(7,9,16,.92),rgba(7,9,16,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav::before{content:"";position:absolute;inset:0 -50vw;z-index:-1;background:inherit;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:800 17px var(--ui);letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px}
.brand b{font-weight:800;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav .links{display:flex;gap:2px;margin-left:18px;flex:1}
.nav .links a{font:500 14px var(--ui);color:var(--dim);text-decoration:none;padding:8px 12px;border-radius:9px;transition:all .15s}
.nav .links a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.navr{display:flex;gap:10px;align-items:center;margin-left:auto}
.chipme{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:99px}
.chipme .rank-badge{width:30px;height:30px;font-size:13px;border-radius:99px;box-shadow:none}
.chipme .t{font:500 11px var(--ui);color:var(--dim);line-height:1.3}
.chipme .t b{display:block;color:var(--ink);font-size:12px;font-weight:600}
@media(max-width:860px){.nav .links{display:none}.chipme .t{display:none}.chipme{padding:4px}}
@media(max-width:560px){#app{padding:0 16px 40px}.navr .btn.ghost{display:none}.navr .btn.cta-nav{padding:8px 12px}}
.crumb{font:500 13px var(--ui);color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.crumb a{color:var(--dim);text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--ink)}

let actx;
function tone(f, d = .12, type = 'square', v = .05, when = 0, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch {}
}
const sfx = {
  click: () => tone(520, .06, 'square', .03),

  wrong: () => tone(220, .3, 'sawtooth', .06, 0, 90),
  tick: () => tone(880, .05, 'square', .03),
  go: () => { tone(440, .1, 'square', .06); tone(660, .1, 'square', .06, .1); tone(990, .25, 'square', .06, .2); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', .09, i * .12)),

/* ============================================================ SOLO */
async function soloRun(subject, topic, level, mode) {

  soloQ();
}
function soloQ() {

  setScreen(`
    <div class="hud solo">
      <div class="panel cut pcard me"><span class="nm">${S.kind === 'drill' ? esc(sb.drill.name.toUpperCase()) : esc(sb.name.toUpperCase()) + ' ACADEMY'}</span><span class="sc" id="sc">${S.score}</span><span class="st ${S.streak > 1 ? 'on' : ''}" id="stk">${S.streak > 1 ? '🔥 STREAK x' + S.streak : 'XP +' + S.xp}</span></div>
      <div class="panel cut mid"><span class="rd">QUESTION</span><span class="tm" style="font-size:28px">${S.i + 1}<span class="dim" style="font-size:15px">/${S.qs.length}</span></span></div>
    </div>
    <div class="timebar"><i style="transform:scaleX(${S.i / S.qs.length});background:linear-gradient(90deg,var(--cyan),var(--pink))"></i></div>
    <div class="panel cut edge qcard"><div class="qtopic">${esc(zn[1].toUpperCase())}${lvBadge(q.level)}</div>${questionHTML(q.text)}</div>
    ${optionsHTML(q.options)}
    <div class="tools"><div class="row"><button class="chip" id="f50" ${S.fifty ? '' : 'disabled'}>✂ 50/50 ×${S.fifty}</button></div><button class="back" id="quit">Quit run</button></div>
    <div id="fb"></div>`);

    if (S.locked || !S.fifty) return; S.fifty--; sfx.click();
    const wrong = [0, 1, 2, 3].filter((k) => k !== q.answer).sort(() => Math.random() - .5).slice(0, 2);
    wrong.forEach((k) => app.querySelector(`.opt[data-i="${k}"]`).classList.add('gone'));

function soloAnswer(c) {

  const q = S.qs[S.i], ok = c === q.answer;
  app.querySelectorAll('.opt').forEach((b) => { b.disabled = true; const k = Number(b.dataset.i); if (k === q.answer) b.classList.add('right'); else if (k === c) b.classList.add('wrong'); });
  let gain = 0;
  if (ok) { S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); gain = ({ easy: 10, moderate: 15, hard: 20 }[q.level] || 10) + Math.min(S.streak - 1, 5) * 2; S.xp += gain; S.score += ({ easy: 100, moderate: 120, hard: 150 }[q.level] || 100) + (S.streak - 1) * 10; S.correct++; sfx.right(); buzz(30); }
  else { S.streak = 0; S.wrongTopics[q.topicName || q.topic] = (S.wrongTopics[q.topicName || q.topic] || 0) + 1; sfx.wrong(); buzz([60, 40, 60]); $('.qcard').classList.add('shake'); }

/* ============================================================ BATTLE (websocket) */
let pingT = null;
function closeSock() { if (sock) { try { sock.onclose = null; sock.close(); } catch {} } sock = null; clearInterval(pingT); if (S) cancelAnimationFrame(S.raf); }
function openSock(then) {
  closeSock();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  toast('Connecting to the arena…');
  const keep = { name: S.name, subject: S.subject };
  const ws = (sock = new WebSocket(`${proto}://${location.host}`));
  ws.onopen = () => { pingT = setInterval(() => sendWS({ t: 'ping' }), 20000); then(); };
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch { return; } onMsg(m); };
  ws.onclose = () => { if (sock !== ws) return; sock = null; clearInterval(pingT); lostOverlay(); };
  ws.onerror = () => {};
  S = Object.assign(S, keep);
}
function sendWS(o) { if (sock && sock.readyState === 1) sock.send(JSON.stringify(o)); }
function leaveToPage() { sendWS({ t: 'leave' }); closeSock(); history.replaceState(null, '', pagePath); route(pagePath); }
function lostOverlay() {

  const d = document.createElement('div'); d.className = 'overlay'; d.id = 'lost';
  d.innerHTML = `<div class="panel cut edge center" style="max-width:420px;display:flex;flex-direction:column;gap:14px"><h3>Connection lost</h3><div class="dim">The arena server restarted or your network dropped. Battles can't resume, but you can start a new one. (Free hosting sleeps when idle, so the first connection can take a minute.)</div><button class="btn" id="lh">Back to home</button></div>`;
  document.body.appendChild(d); $('#lh').onclick = () => { d.remove(); history.replaceState(null, '', '/'); route('/'); };
}
function onMsg(m) {
  switch (m.t) {
    case 'hello': S.me = m.id; break;
    case 'joined': S.me = m.you; S.mode = 'battle'; break;
    case 'err': toast(m.msg, true); sfx.wrong(); if (S.mode !== 'battle') closeSock(); break;
    case 'lobby': S.room = m; lobby(); break;
    case 'get_ready': S.mode = 'battle'; S.score = 0; S.opp = 0; S.total = m.total; S.names = Object.fromEntries(m.players.map((p) => [p.id, p.name])); S.scores = Object.fromEntries(m.players.map((p) => [p.id, 0])); S.streak = 0; S.bsubject = m.subject; S.bmode = m.mode; ready(m); break;
    case 'q': question(m); break;
    case 'locked': S.lockedIds = S.lockedIds || {}; S.lockedIds[m.id] = true; if (m.id !== S.me) { const o = $('#oppst'); if (o && (S.room.players.length <= 2)) { o.textContent = 'LOCKED IN ✓'; o.className = 'st on'; } sfx.tick(); } strip(); break;
    case 'reveal': revealRound(m); break;
    case 'rq_wait': S.rq = m; rankedWait(m); break;
    case 'rq_cancelled': break;
    case 'rank_err': toast(m.msg, true); sfx.wrong(); closeSock(); rankedPage(m.offline ? m.msg : ''); break;
    case 'over': overScreen(m); break;
    case 'player_left': toast((m.name || 'A player') + ' left the room', true); if (S.names) delete S.names[m.id]; if (S.scores) delete S.scores[m.id]; if (S.room) S.room.players = S.room.players.filter((p) => p.id !== m.id); strip(); break;
    case 'rematch_vote': S.votes = m.ids; { const b = $('#rm'); if (b) { const mine = m.ids.includes(S.me); b.textContent = mine ? `Waiting… (${m.ids.length} ready)` : `Rematch (${m.ids.length} ready)`; b.disabled = mine; } } break;
    case 'opp_left': toast('Your rival left the arena', true); document.getElementById('cdov') && document.getElementById('cdov').remove(); cancelAnimationFrame(S.raf); break;
  }
}
const others = () => S.room.players.filter((p) => p.id !== S.me);
function lobby() {

function ready(m) {

  setScreen(`
    <div class="hud">
      ${hudCard('me', S.names[S.me] || S.name, S.score, S.streak > 1 ? '🔥 STREAK x' + S.streak : '&nbsp;')}
      <div class="panel cut mid"><span class="rd">ROUND ${m.i + 1}/${m.total}</span><span class="tm" id="tm">15</span></div>
      ${hudCard('opp', multi ? 'TOP RIVAL: ' + (S.names[opp ? opp.id : ''] || '') : (S.names[opp ? opp.id : ''] || 'Rival'), S.opp, multi ? '&nbsp;' : 'THINKING…')}
    </div>
    ${multi ? '<div class="scorestrip" id="strip"></div>' : ''}
    <div class="timebar"><i id="tb" style="transform:scaleX(1)"></i></div>
    <div class="panel cut edge qcard"><div class="qtopic">${esc(zn[1].toUpperCase())}${lvBadge(m.level)}</div>${questionHTML(m.text)}</div>
    ${optionsHTML(m.options)}
    <div id="fb"></div>`);
  strip();
  app.querySelectorAll('.opt').forEach((b) => (b.onclick = () => battleAnswer(Number(b.dataset.i))));
  const end = performance.now() + m.limit; cancelAnimationFrame(S.raf); let lastSec = 99;
  const loop = () => {
    const left = Math.max(0, end - performance.now()), tb = $('#tb'), tm = $('#tm');
    if (!tb || S.revealed) return;
    tb.style.transform = `scaleX(${left / m.limit})`;
    const s = Math.ceil(left / 1000); tm.textContent = s; tm.className = 'tm' + (s <= 5 ? ' low' : '');
    if (s !== lastSec) { lastSec = s; if (s <= 5 && s > 0 && !S.locked) sfx.tick(); }
    S.raf = requestAnimationFrame(loop);
  };
  loop();
}
function battleAnswer(c) {
  if (S.locked || S.revealed) return; S.locked = true; S.choice = c; sfx.click(); buzz(15);
  sendWS({ t: 'ans', i: S.q.i, c });
  app.querySelectorAll('.opt').forEach((b) => { b.disabled = true; if (Number(b.dataset.i) === c) b.classList.add('picked'); });
  const m = $('#mest'); if (m) { m.textContent = 'LOCKED IN ✓'; m.className = 'st on'; }
  S.lockedIds = S.lockedIds || {}; S.lockedIds[S.me] = true; strip();
}
function revealRound(m) {
  cur = 'revealRound';
  S.revealed = true; cancelAnimationFrame(S.raf);
  const mine = m.results.find((r) => r.id === S.me) || { choice: null, ok: false, pts: 0, score: S.score, streak: 0 };
  const rivals = m.results.filter((r) => r.id !== S.me);
  m.results.forEach((r) => { S.scores = S.scores || {}; S.scores[r.id] = r.score; });
  const multi = rivals.length > 1;
  const top = rivals.slice().sort((a, b) => b.score - a.score)[0];
  app.querySelectorAll('.opt').forEach((b) => {
    b.disabled = true; b.classList.remove('picked'); const k = Number(b.dataset.i);
    if (k === m.answer) b.classList.add('right'); else if (k === mine.choice) b.classList.add('wrong');
    const n = rivals.filter((r) => r.choice === k).length;
    if (n) b.insertAdjacentHTML('afterbegin', `<span class="tagr">${multi ? (n > 1 ? n + ' RIVALS' : 'RIVAL') : 'RIVAL'}</span>`);
    if (mine.choice === k) b.insertAdjacentHTML('afterbegin', `<span class="tagr tagy">YOU</span>`);
  });
  S.score = mine.score; S.streak = mine.streak; S.opp = top ? top.score : 0;
  const pop = (sel, r) => { const c = $(sel); if (c && r.pts) c.insertAdjacentHTML('beforeend', `<span class="pop">+${r.pts}</span>`); };
  $('#mesc').textContent = mine.score; $('#oppsc').textContent = S.opp; pop('.pcard.me', mine); if (top) pop('.pcard.opp', top);
  const ms = $('#mest'), os = $('#oppst');
  ms.textContent = mine.ok ? (mine.streak > 1 ? '🔥 STREAK x' + mine.streak : 'CORRECT') : (mine.choice === null ? 'TIME UP' : 'MISSED'); ms.className = 'st ' + (mine.ok ? 'on' : '');
  if (top && !multi) { os.textContent = top.ok ? 'CORRECT' : top.choice === null ? 'TIME UP' : 'MISSED'; os.className = 'st ' + (top.ok ? 'on' : ''); }
  if (multi && os) os.textContent = rivals.filter((r) => r.ok).length + ' OF ' + rivals.length + ' RIVALS CORRECT';
  if (mine.ok) { sfx.right(); buzz(30); } else { sfx.wrong(); buzz([60, 40, 60]); }
  strip();
  const fb = $('#fb');
  fb.innerHTML = `<div class="panel cut explain ${mine.ok ? '' : 'bad'}"><div class="hd ${mine.ok ? 'g' : 'r'}">${mine.ok ? 'CORRECT +' + mine.pts : mine.choice === null ? 'TIME UP' : 'NOT QUITE'}</div><p>${esc(m.explain)}</p><div class="small dim" style="margin-top:8px">${m.last ? 'FINAL RESULTS INCOMING…' : 'NEXT QUESTION INCOMING…'}</div></div>`;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function overScreen(m) {
  cur = 'overScreen';
  const mine = m.standings.find((s) => s.id === S.me) || { score: 0, correct: 0 };
  const res = m.winner === null ? 'draw' : m.winner === S.me ? 'win' : 'lose';
  P.battles++; if (res === 'win') P.wins++;
  const xp = Math.round(mine.score / 10) + (res === 'win' ? 50 : res === 'draw' ? 20 : 0);
  const before = rankOf(P.xp); addXP(xp); const after = rankOf(P.xp);
  const myWins = (m.wins.find((w) => w.id === S.me) || {}).wins || 0;
  const place = m.standings.findIndex((s) => s.id === S.me) + 1;
  const row = (s, i) => `<div class="panel cut stand ${i === 0 && m.winner ? 'first' : ''}"><span class="pos">${i + 1}</span><span class="nm">${esc(s.name)}${s.id === S.me ? ' (YOU)' : ''}<div class="small dim" style="letter-spacing:.05em;font-family:var(--body)">${s.correct}/${m.total} correct</div></span><span class="pt">${s.score}</span></div>`;
  const sb = subj(m.subject);
  const rk = m.ranked && m.ranked[S.me];
  const rankCard = m.kind === 'bot' ? '<div class="panel cut edge small dim center">Practice match against ByteBot. Unrated: your rating did not change.</div>' : m.kind === 'ranked' ? (rk ? `<div class="panel cut edge center"><div class="lbl">Rating</div><div class="disp" style="font-size:30px">${rk.before} → ${rk.after} <span style="color:${rk.delta >= 0 ? 'var(--lime)' : 'var(--red)'}">${rk.delta >= 0 ? '+' : ''}${rk.delta}</span></div><div class="small dim">${esc(rk.tier)}${m.forfeit ? ' · win by forfeit' : ''}</div></div>` : `<div class="panel cut edge center" style="border-color:var(--red)">${esc((m.ranked && m.ranked.error) || 'Result could not be saved. No rating was changed.')}</div>`) : '';
  setScreen(`
    <div class="banner ${res}"><div class="dim disp small" style="letter-spacing:.1em;margin-bottom:8px;font-weight:600">${esc(sb.name.toUpperCase())} BATTLE OVER ${lvBadge(m.level)}</div><h2>${res === 'win' ? 'VICTORY' : res === 'lose' ? (m.standings.length > 2 ? 'PLACE #' + place : 'DEFEAT') : 'DRAW'}</h2></div>
    <div style="display:flex;flex-direction:column;gap:10px">${m.standings.map(row).join('')}</div>
    ${rankCard}
    <div class="stats">
      <div class="panel cut stat"><div class="v" style="color:var(--lime)">+${xp}</div><div class="l">XP EARNED</div></div>
      <div class="panel cut stat"><div class="v">${myWins}</div><div class="l">WINS IN THIS ROOM</div></div>
      <div class="panel cut stat"><div class="v">${rankOf(P.xp).name.split(' ')[0]}</div><div class="l">${after.i > before.i ? 'RANK UP!' : 'YOUR RANK'}</div></div>
    </div>
    ${reviewHTML((m.review || []).map((r) => ({ q: r, yours: r.choices[S.me] })))}
    <div class="row center">${m.kind === 'ranked' ? '<button class="btn amber" id="rm">Back to ladder</button>' : '<button class="btn amber" id="rm">Rematch</button>'}<button class="btn ghost" id="hm">Leave arena</button></div>${footHTML}`);
  store.save();
  res === 'win' ? sfx.win() : res === 'lose' ? sfx.lose() : sfx.click();
  $('#rm').onclick = () => { sfx.click(); if (m.kind === 'ranked') { leaveToPage(); return; } sendWS({ t: 'rematch' }); $('#rm').textContent = 'Waiting for others…'; $('#rm').disabled = true; };
  $('#hm').onclick = () => leaveToPage();
}


/* ============================================================ RANKED */
function myUid() {
  if (!P.uid) { const a = new Uint8Array(12); crypto.getRandomValues(a); P.uid = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); store.save(); }
  return P.uid;
}
async function rankedPage(warn) {
  cur = 'ranked'; pagePath = '/ranked'; S = {};
  document.title = 'Ranked ladder | CS Arena';
  await loadSubjects();
  const ready = SUBJ_LIST.filter((s) => s.ready);
  const sel = S.rsub = (ready.find((s) => s.id === P.rsub) || ready[0] || { id: 'dbms' }).id;
  const lvl = S.rlvl = P.rlvl || 'mixed';
  let ladder = { status: 'offline', top: [], durable: false }, prof = null;
  try { ladder = await (await fetch('/api/ladder')).json(); } catch {}
  try { prof = await (await fetch('/api/profile?uid=' + myUid())).json(); } catch {}
  const me = prof && prof.player;
  const offline = ladder.status !== 'ok' || (prof && prof.status === 'offline');
  const rows = ladder.top.length ? ladder.top.map((r, i) => `<div class="panel cut stand ${i === 0 ? 'first' : ''}"><span class="pos">${i + 1}</span><span class="nm">${esc(r.name)}<div class="small dim" style="letter-spacing:.05em;font-family:var(--body)">${esc(r.tier)} · ${r.wins}W / ${r.games} played</div></span><span class="pt">${r.rating}</span></div>`).join('') : '<div class="dim small">No ranked matches played yet. Be the first on the ladder.</div>';
  setScreen(`
    <div class="crumb"><a href="/" data-nav>HOME</a> › <span class="cur">RANKED</span></div>
    <div class="banner"><div class="dim disp small" style="letter-spacing:.1em;margin-bottom:8px;font-weight:600">1V1 COMPETITIVE</div><h2>RANKED LADDER</h2></div>
    ${warn || offline ? `<div class="panel cut edge" style="border-color:var(--red)"><b style="color:var(--red)">Ranked is offline.</b> <span class="dim">${esc(warn || 'The ladder database is unreachable, so ratings cannot be saved. Play unrated in any subject page for now.')}</span></div>` : ''}
    ${!offline && !ladder.durable ? '<div class="panel cut edge small dim">This ladder is temporary and resets when the server restarts.</div>' : ''}
    <div class="panel cut edge"><div class="lbl">Your rating</div><div class="disp" style="font-size:34px">${me ? me.rating : 1000} <span class="dim" style="font-size:14px">${esc(me ? me.tier : 'Rookie')} · ${me ? me.games : 0} ranked games</span></div><div class="small dim">Your ranked identity is stored in this browser. Clearing site data starts a new profile.</div></div>
    <div class="panel cut edge"><label class="lbl" for="rnick">Your gamer tag</label><input type="text" id="rnick" maxlength="16" placeholder="e.g. NullPointer" value="${esc(P.name)}" autocomplete="off"><div class="small dim" style="margin-top:8px">Ranked nicknames appear on the public ladder, visible to anyone. Do not use your real name, phone number or email.</div></div>
    <div class="panel cut edge"><label class="lbl">Subject</label><div class="lvrow" id="rsubs">${ready.map((s) => `<button class="chip lv ${s.id === sel ? 'on' : ''}" data-s="${s.id}" style="--c:${s.color}">${esc(s.name.toUpperCase())}</button>`).join('')}</div>
      <label class="lbl" style="margin-top:12px">Difficulty</label><div class="lvrow" id="rlvs">${['easy', 'moderate', 'hard', 'mixed'].map((l) => `<button class="chip lv ${lvl === l ? 'on' : ''}" data-l="${l}" style="--c:${LEVEL_UI[l][1]}">${LEVEL_UI[l][0]}</button>`).join('')}</div></div>
    <div class="row center"><button class="btn amber" id="rfind" ${offline ? 'disabled' : ''}>Find ranked match</button></div>
    <div class="sec"><header><div class="eyebrow">LEADERBOARD</div><h2>Top players</h2></header><div style="display:flex;flex-direction:column;gap:10px">${rows}</div></div>
    ${footHTML}`);
  app.querySelectorAll('#rsubs .chip').forEach((b) => (b.onclick = () => { P.rsub = S.rsub = b.dataset.s; store.save(); app.querySelectorAll('#rsubs .chip').forEach((x) => x.classList.toggle('on', x === b)); }));
  app.querySelectorAll('#rlvs .chip').forEach((b) => (b.onclick = () => { P.rlvl = S.rlvl = b.dataset.l; store.save(); app.querySelectorAll('#rlvs .chip').forEach((x) => x.classList.toggle('on', x === b)); }));
  $('#rfind').onclick = () => {
    const name = ($('#rnick').value || '').trim();
    if (!name) return toast('Enter a gamer tag first', true);
    P.name = name; store.save(); sfx.click();
    const subject = S.rsub, level = S.rlvl;
    S = { name, subject, mode: 'rank' };
    openSock(() => sendWS({ t: 'rq', uid: myUid(), name, subject, level }));
  };
}
function rankedWait(m) {
  cur = 'rankWait';
  const t0 = Date.now();
  setScreen(`<div class="banner"><div class="dim disp small" style="letter-spacing:.1em;margin-bottom:8px;font-weight:600">${esc(subj(S.subject).name.toUpperCase())} · RATING ${m.rating} · ${esc(m.tier.toUpperCase())}</div><h2>SEARCHING FOR A RIVAL…</h2></div>
    <div class="panel cut edge center"><div class="dim" id="rwt">Waiting 0s. The search range widens the longer you wait.</div></div>
    <div class="row center"><button class="btn amber" id="rbot" disabled>Practise vs ByteBot (unrated) in 20s</button><button class="btn ghost" id="rcx">Cancel</button></div>
    ${footHTML}`);
  const tick = setInterval(() => {
    if (cur !== 'rankWait') return clearInterval(tick);
    const sec = Math.floor((Date.now() - t0) / 1000); const w = $('#rwt'); if (w) w.textContent = 'Waiting ' + sec + 's. The search range widens the longer you wait.';
    const b = $('#rbot'); if (b) { b.disabled = sec < 20; b.textContent = sec < 20 ? 'Practise vs ByteBot (unrated) in ' + (20 - sec) + 's' : 'Practise vs ByteBot (unrated, no rating change)'; }
  }, 1000);
  $('#rbot').onclick = () => { sfx.click(); sendWS({ t: 'rbot' }); };
  $('#rcx').onclick = () => { sendWS({ t: 'rq_cancel' }); closeSock(); go('/ranked', true); };
}

/* ============================================================ boot + Back button */
function backAction() {
  switch (cur) {
    case 'soloQ': if (confirm('Leave this run? Progress for this run is lost.')) go(pagePath, true); break;
    case 'soloDone': go(pagePath, true); break;
    case 'lobby': case 'ready': case 'question': case 'revealRound':
      if (confirm('Leave this battle?')) leaveToPage(); break;
    case 'overScreen': leaveToPage(); break;
    default: route(location.pathname, location.hash);
  }
}
const IN_FLOW = ['soloQ', 'soloDone', 'lobby', 'ready', 'question', 'revealRound', 'overScreen'];
window.addEventListener('popstate', () => {
  if (IN_FLOW.includes(cur)) { history.pushState({}, '', location.pathname + location.search); backAction(); return; }
  route(location.pathname, location.hash);
});
loadSubjects().then(() => route(location.pathname, location.hash));
</script>
